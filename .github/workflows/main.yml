name: Add Installer Submodule

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add git submodule
        run: |
          git submodule add https://github.com/DaniHasReal/UN1CA-a04-a34x.git target/a04/installer
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .gitmodules target/a04/installer
          git commit -m "Add target/a04/installer submodule"
          git push
