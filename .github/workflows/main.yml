name: Fix and Copy Tee Folder Content

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-tee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Remove submodule or directory completely
        run: |
          git submodule deinit -f target/a04/patches/tee || true
          git rm -rf target/a04/patches/tee || true
          rm -rf .git/modules/target/a04/patches/tee || true
          git config -f .gitmodules --remove-section submodule.target/a04/patches/tee || true
          rm -rf target/a04/patches/tee

      - name: Checkout target tee repository
        uses: actions/checkout@v4
        with:
          repository: 'ohjhas/target_a04_patches_tee'
          path: 'temp_tee_source'

      - name: Copy contents to tee folder directly
        run: |
          mkdir -p target/a04/patches/tee
          # نسخ الملفات عدا مجلد .git الخاص بالمستودع الفرعي
          find temp_tee_source -mindepth 1 -maxdepth 1 ! -name '.git' -exec cp -r {} target/a04/patches/tee/ \;
          rm -rf temp_tee_source
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add target/a04/patches/tee
          git commit -m "Remove tee submodule and copy its files directly" || echo "No changes to commit"
          git push
