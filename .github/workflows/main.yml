name: Copy Installer Folder Content

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-folder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Remove existing submodule if present
        run: |
          git submodule deinit -f target/a04/installer || true
          git rm -rf target/a04/installer || true
          rm -rf .git/modules/target/a04/installer || true
          git config -f .gitmodules --remove-section submodule.target/a04/installer || true
          rm -rf target/a04/installer

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: 'DaniHasReal/UN1CA-a04-a34x'
          ref: 'd84dfc7dc3c03abc336767b2d3a32838362b7433'
          path: 'temp_source'

      - name: Copy target/a04/installer contents
        run: |
          mkdir -p target/a04/installer
          cp -r temp_source/target/a04/installer/* target/a04/installer/
          rm -rf temp_source
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .gitmodules target/a04/installer
          git commit -m "Replace submodule with actual installer folder content" || echo "No changes to commit"
          git push
